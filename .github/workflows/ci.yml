name: CI

# Cek kualitas di Pull Request, sebelum merge ke master. Deploy tetap hanya
# lewat deploy.yml saat push ke master.
on:
  pull_request:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
