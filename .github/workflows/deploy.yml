name: Deploy to Cloudflare

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: "libsql://REDACTED.turso.io"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "REDACTED_CLERK_PUBLISHABLE_KEY"
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/masuk"
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/daftar"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "REDACTED_VAPID_PUBLIC_KEY"
