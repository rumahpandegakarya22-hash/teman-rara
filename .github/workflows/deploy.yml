name: Deploy to Cloudflare

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Konfigurasi non-rahasia diambil dari GitHub Variables, bukan dari repo.
      - run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy -- \
            --var DATABASE_URL:"$DATABASE_URL" \
            --var DRIVE_FOLDER_DOKUMEN_INTERNAL:"$DRIVE_FOLDER_DOKUMEN_INTERNAL" \
            --var DRIVE_FOLDER_BUKTI_PEMBAYARAN_SEWA:"$DRIVE_FOLDER_BUKTI_PEMBAYARAN_SEWA" \
            --var DRIVE_FOLDER_PENGADUAN:"$DRIVE_FOLDER_PENGADUAN" \
            --var DRIVE_DOKUMEN_PENGHUNI:"$DRIVE_DOKUMEN_PENGHUNI" \
            --var DRIVE_FOLDER_BUKTI_PEMBAYARAN_DP:"$DRIVE_FOLDER_BUKTI_PEMBAYARAN_DP" \
            --var GOOGLE_CLIENT_ID:"$GOOGLE_CLIENT_ID" \
            --var NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:"$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            --var NEXT_PUBLIC_VAPID_PUBLIC_KEY:"$NEXT_PUBLIC_VAPID_PUBLIC_KEY" \
            --var VAPID_SUBJECT:"$VAPID_SUBJECT" \
            --var NEXT_PUBLIC_CLERK_SIGN_IN_URL:"$NEXT_PUBLIC_CLERK_SIGN_IN_URL" \
            --var NEXT_PUBLIC_CLERK_SIGN_UP_URL:"$NEXT_PUBLIC_CLERK_SIGN_UP_URL" \
            --var TELEGRAM_CHAT_ID:"$TELEGRAM_CHAT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DRIVE_FOLDER_DOKUMEN_INTERNAL: ${{ vars.DRIVE_FOLDER_DOKUMEN_INTERNAL }}
          DRIVE_FOLDER_BUKTI_PEMBAYARAN_SEWA: ${{ vars.DRIVE_FOLDER_BUKTI_PEMBAYARAN_SEWA }}
          DRIVE_FOLDER_PENGADUAN: ${{ vars.DRIVE_FOLDER_PENGADUAN }}
          DRIVE_DOKUMEN_PENGHUNI: ${{ vars.DRIVE_DOKUMEN_PENGHUNI }}
          DRIVE_FOLDER_BUKTI_PEMBAYARAN_DP: ${{ vars.DRIVE_FOLDER_BUKTI_PEMBAYARAN_DP }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /masuk
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /daftar
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
